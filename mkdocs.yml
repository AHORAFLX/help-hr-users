site_name: Sebastian HR  # ← Your site name here
theme:
  name: material
  custom_dir: ./overrides/
  logo: docs_assets/Sebastian HR Blanco.png
  favicon: docs_assets/favicon.ico
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: darkmode
      toggle:
        icon: octicons/sun-16
        name: Switch to light mode
  language: es
  features:
    - navigation.path
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
use_directory_urls: true
# Your project navigation structure here ↓
nav:
  - Inicio: index.md
  - Tus páginas personales:
      - Home: tus-paginas-personales/home.md
      - Área personal: tus-paginas-personales/area-personal.md
  - Instancias y solicitudes:
      - Tipos de instancia: instancias-y-solicitudes/tipos-de-instancia.md
      - Solicitud, seguimiento y validación: instancias-y-solicitudes/solicitud-seguimiento-y-validacion.md
  - Fichajes:
      - Fichar: fichajes/fichar.md
      - Consulta y correcciones: fichajes/consulta-y-correcciones.md
  - Ausencias y vacaciones:
      - Solicitud y cancelación: ausencias-y-vacaciones/solicitud-y-cancelacion.md
      - Consulta de totales: ausencias-y-vacaciones/consulta-de-totales.md
  - Planificación de turnos:
      - Mi planificación: planificacion-de-turnos/mi-planificacion.md
  - Mis datos laborales:
      - Mi contrato: mis-datos-laborales/mi-contrato.md
  - Equipos y estructura corporativa:
      - Mi responsable: equipos-y-estructura-corporativa/mi-responsable.md
      - Mi equipo: equipos-y-estructura-corporativa/mi-equipo.md
      - Mi unidad organizativa: equipos-y-estructura-corporativa/mi-unidad-organizativa.md
  - Vigilancia de la salud:
      - Mis vigilancias de salud: vigilancia-de-la-salud/mis-vigilancias-de-salud.md
  - Cursos:
      - Cursos y certificaciones: cursos/cursos-y-certificaciones.md
  - Reservas, viajes y gastos:
      - Reservas: reservas-viajes-y-gastos/reservas.md
      - Gastos: reservas-viajes-y-gastos/gastos.md
      - Viajes: reservas-viajes-y-gastos/viajes.md
  - Documentación y comunicación con la empresa:
      - Noticias: documentacion-y-comunicacion-con-la-empresa/noticias.md
      - Documentación: documentacion-y-comunicacion-con-la-empresa/documentacion.md
      - Buzón de sugerencias: documentacion-y-comunicacion-con-la-empresa/buzon-de-sugerencias.md
extra:
  version:
    provider: mike
extra_css:
  # Basic styles for every documentation project
  ## Basic Structure
  - stylesheets/custom-colors.css
  - stylesheets/fh-structural/base.css
  - stylesheets/fh-structural/code-highlighting.css
  - stylesheets/fh-structural/css-class-components.css
  - stylesheets/fh-structural/404-error.css
  ## Basic components
  - stylesheets/fh-structural/components/fh-modal.css
  - stylesheets/fh-structural/components/fh-copy.css
  - stylesheets/fh-structural/components/fh-namepropagator.css
  - stylesheets/fh-structural/components/fh-versions.css
  ## Basic fonts and icons
  # Pendiente: recuperar docs_assets/fh-structural/fonts/ de la plantilla.
  # Comentado para que el sitio no cargue con 404 mientras falte ese material.
  # - docs_assets/fh-structural/fonts/flags/flags.css
  # - docs_assets/fh-structural/fonts/flexygo/utils.css
  # - docs_assets/fh-structural/fonts/flexygo/flexygo-icons.css

  # Your project styles files here ↓

extra_javascript:
  # Basic javascripts for every documentation project
  ## Basic utilities
  - javascripts/fh-structural/utils.js
  ## Basic components
  - javascripts/fh-structural/components/fh-modal.js
  - javascripts/fh-structural/components/fh-copy.js
  - javascripts/fh-structural/components/fh-popover.js
  - javascripts/fh-structural/components/fh-namepropagator.js
  - javascripts/fh-structural/components/flx-navbutton.js
  - javascripts/fh-structural/components/fh-versions.js
  ## Translation files
  - javascripts/cultures/default_language.js
  - javascripts/cultures/es.js
  - javascripts/cultures/en.js

  # Your project js files here ↓

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - admonition
  - footnotes
  - abbr  # Abreviaciones con tooltips
  - def_list  # Listas de definición
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys  # Marcado de teclado (++ctrl+c++)
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details  # Admonitions colapsables
  - attr_list
  - md_in_html
plugins:
  - search
  - i18n:
      languages:
        - locale: es
          name: Español
          build: true
          default: true
        - locale: en
          name: English
          build: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
        - not-zoomable
        - fh-image-of-title
